services:
  db:
    image: postgres:17-alpine
    pull_policy: never
    container_name: careermate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careermate_db}
      POSTGRES_USER: ${POSTGRES_USER:-careermate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careermate_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-careermate_user} -d $${POSTGRES_DB:-careermate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: careermate_postgres_data
