{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — CareerMate AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
</head>
<body class="login-screen">

<div class="login-card">
  <div class="text-center mb-4">
    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
      <i class="bi bi-shield-lock-fill fs-2"></i>
    </div>
    <h4 class="fw-bold mb-1">CareerMate <span class="text-primary">AI</span></h4>
    <p class="text-muted small">Custom Administrator Management Portal</p>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} py-2 px-3 small" role="alert">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label small fw-semibold">Admin Username</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label for="id_password" class="form-label small fw-semibold">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-key"></i></span>
        <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Portal
    </button>
  </form>

  <div class="mt-4 pt-3 border-top text-center">
    <small class="text-muted">
      For database-level administration, use <a href="{% url 'admin:index' %}" class="text-decoration-none">Django Admin</a>
    </small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
