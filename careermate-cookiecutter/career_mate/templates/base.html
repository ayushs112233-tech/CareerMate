<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CareerMate AI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'accounts:login' %}">CareerMate <span>AI</span></a>
        <nav class="site-nav" aria-label="Main navigation">
        {% if user.is_authenticated %}
            <span class="user-greeting">Signed in as {{ user.username }}</span>
            <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Log in</a>
            <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
        </nav>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
