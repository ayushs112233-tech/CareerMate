{% extends "candidate/base.html" %}
{% block title %}Profile | CareerMate{% endblock %}
{% block candidate_content %}<form method="post" class="form-layout">{% csrf_token %}<section class="panel"><div class="panel-heading"><div><p class="eyebrow">YOUR STORY</p><h2>Make your profile feel like you.</h2></div><button class="button button-primary" type="submit">Save profile</button></div><div class="form-grid"><label>First name {{ form.first_name }}</label><label>Last name {{ form.last_name }}</label><label>Email {{ form.email }}</label><label>Phone {{ form.phone }}</label><label class="wide">Headline {{ form.headline }}<small>Describe the role you are moving toward.</small></label><label>Location {{ form.location }}</label><label>Experience (years) {{ form.experience_years }}</label><label class="wide">Career objective / bio {{ form.bio }}</label><label class="wide">Education {{ form.education }}</label></div></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">SKILL SIGNAL</p><h2>What can you bring?</h2></div></div><div class="skill-checks">{{ form.skills }}</div></section></form>{% endblock %}
